<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>激情聊天室</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: linear-gradient(to bottom, #1e3a8a, #3b82f6); min-height: 100vh; }
        #chatBox { max-height: 500px; overflow-y: auto; }
        .message { display: flex; align-items: flex-start; margin-bottom: 1rem; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; margin-right: 0.5rem; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: bold; color: white; }
        .self { justify-content: flex-end; }
        .self .content { background-color: #34d399; color: white; }
        .other .content { background-color: white; color: black; }
        .content { padding: 0.5rem 1rem; border-radius: 0.5rem; max-width: 70%; }
    </style>
</head>
<body class="flex flex-col items-center p-4">
<h1 class="text-3xl font-bold text-white mb-4">Jav聊天室</h1>
<div id="chatBox" class="w-full max-w-2xl bg-white rounded-lg shadow-lg p-4 mb-4"></div>
<div class="w-full max-w-2xl flex space-x-2">
    <input id="inputBox" type="text" class="flex-1 p-2 rounded-lg border" placeholder="输入消息...">
    <button id="sendButton" class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600">发送</button>
</div>

<script>
    // 随机中文名字库
    const chineseWords = ["张", "伟", "杰", "李", "明", "华", "王", "强", "丽", "芳", "陈", "阳", "刘", "欣", "宇"];
    // 随机背景颜色
    const colors = ["#ef4444", "#3b82f6", "#10b981", "#f59e0b", "#8b5cf6"];

    function generateRandomName() {
        return Array.from({ length: 3 }, () => chineseWords[Math.floor(Math.random() * chineseWords.length)]).join("");
    }

    // 生成随机头像背景颜色
    function getRandomColor() {
        return colors[Math.floor(Math.random() * colors.length)];
    }

    // 当前用户
    const username = generateRandomName();
    const userColor = getRandomColor();
    const ws = new WebSocket("ws://localhost:8080/ws");
    const chatBox = document.getElementById("chatBox");
    const inputBox = document.getElementById("inputBox");
    const sendButton = document.getElementById("sendButton");

    ws.onopen = () => {
        addMessage(`${username} 加入聊天室`, false);
    };

    ws.onmessage = (event) => {
        const message = event.data;
        const isSelf = message.startsWith(username + ": ");
        addMessage(message, isSelf);
    };

    ws.onclose = () => {
        addMessage("连接已断开", false);
    };

    function addMessage(message, isSelf) {
        const div = document.createElement("div");
        div.className = `message ${isSelf ? "self" : "other"}`;
        // 提取消息中的用户名（格式为 "用户名: 消息内容"）
        const senderName = message.includes(": ") ? message.split(": ")[0] : message;
        const avatarLetter = senderName[0]; // 取用户名首字母
        const avatarColor = isSelf ? userColor : getRandomColor();
        div.innerHTML = `
                <div class="avatar" style="background-color: ${avatarColor}">${avatarLetter}</div>
                <div class="content">${message}</div>
            `;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    sendButton.onclick = () => {
        const message = inputBox.value.trim();
        if (message) {
            ws.send(message);
            inputBox.value = "";
        }
    };

    inputBox.addEventListener("keypress", (event) => {
        if (event.key === "Enter") {
            sendButton.click();
        }
    });
</script>
</body>
</html>
